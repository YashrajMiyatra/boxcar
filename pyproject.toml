[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boxcar"
version = "1.0.0"
authors = [{ name = "zeroydelta" }]
description = "A lightweight Linux Container Runtime and OCI Image Puller built from scratch."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
boxcar = "boxcar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["boxcar*"]
